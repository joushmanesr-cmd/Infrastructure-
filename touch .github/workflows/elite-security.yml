name: Elite Secure CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  security-events: write
  packages: write
  id-token: write

env:
  NODE_VERSION: 24
  IMAGE_NAME: secure-app

jobs:

# ---------------------------
# SECRET SCANNING
# ---------------------------
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source . --redact

# ---------------------------
# DEPENDENCY SECURITY
# ---------------------------
  dependencies:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci

      - name: NPM Audit
        run: npm audit --audit-level=high

      - name: OpenSSF Scorecard
        uses: ossf/scorecard-action@v2

# ---------------------------
# CODEQL SAST
# ---------------------------
  codeql:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - run: npm ci

      - name: Analyze
        uses: github/codeql-action/analyze@v4

# ---------------------------
# BUILD & TEST
# ---------------------------
  build:
    runs-on: ubuntu-latest
    needs: [dependencies, codeql]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - run: npm ci
      - run: npm test --if-present
      - run: npm run build --if-present

# ---------------------------
# SBOM (SUPPLY CHAIN)
# ---------------------------
  sbom:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          format: spdx-json
          output-file: sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json

# ---------------------------
# DOCKER BUILD
# ---------------------------
  docker:
    runs-on: ubuntu-latest
    needs: sbom

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t $IMAGE_NAME:latest .

# ---------------------------
# CONTAINER SECURITY SCAN
# ---------------------------
  container-scan:
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Scan container
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: secure-app:latest
          severity: CRITICAL,HIGH
          exit-code: "1"

# ---------------------------
# ARTIFACT SIGNING (SUPPLY CHAIN)
# ---------------------------
  sign:
    runs-on: ubuntu-latest
    needs: container-scan

    steps:
      - uses: sigstore/cosign-installer@v3

      - name: Sign Image (Keyless)
        run: cosign sign --yes secure-app:latest

# ---------------------------
# DEPLOYMENT GATE
# ---------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: sign
    environment: production

    steps:
      - name: Deploy verified artifact
        run: echo "Deploying signed & verified build"
